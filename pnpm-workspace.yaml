packages:
  - apps/*
  - packages/*

# Shared versions, referenced by "catalog:" in the packages.
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.2
  fast-check: ^4.10.2
  zod: ^4.6.5
  '@types/node': ^24.0.0

# Install scripts are opt-in. These two come from next-intl (optional message extraction)
# and ship prebuilt binaries through optional dependencies: no build needed.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
